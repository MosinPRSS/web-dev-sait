services:
  db:
    container_name: intern_db
    image: 'postgres:18-alpine'
    restart: on-failure
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/docker

  server:
    build: ./server
  client:
    build: ./client

volumes:
  postgres-data: